<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroTool Hub — In-Chat Interactive Widget</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 10px; }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .widget-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .widget-actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: #0284c7; border-color: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .sandbox-container {
      width: 100%;
      height: 440px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .status-bar {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="widget-header">
    <div class="widget-title" id="toolHeading">⚡ MicroTool Live Preview</div>
    <div class="widget-actions">
      <button class="btn" id="reloadBtn" title="Reload Tool">↻ Reload</button>
      <button class="btn" id="fullscreenBtn" title="Expand Fullscreen">⛶ Fullscreen</button>
      <button class="btn btn-primary" id="openStudioBtn" title="Open in Studio">↗ Studio</button>
    </div>
  </div>

  <div class="sandbox-container">
    <iframe id="toolIframe" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  </div>

  <div class="status-bar">
    <span id="statusText">Interactive MCP App &bull; Isolated Sandbox</span>
    <span id="versionText">MicroTool Hub</span>
  </div>

  <script>
    const openai = typeof window !== 'undefined' ? window.openai : undefined;
    let projectData = null;

    function renderTool(project) {
      projectData = project;
      document.getElementById('toolHeading').textContent = '⚡ ' + (project.name || 'MicroTool');
      document.getElementById('versionText').textContent = project.slug || 'Ready';

      const frame = document.getElementById('toolIframe');
      const doc = frame.contentWindow.document;

      let html = project.html || '<div style="padding:20px;font-family:sans-serif;"><h3>Empty Tool</h3><p>Write code to view preview.</p></div>';
      if (project.css) {
        html = `<style>${project.css}</style>` + html;
      }
      if (project.js) {
        html += `<script>${project.js}<\/script>`;
      }

      doc.open();
      doc.write(html);
      doc.close();

      // State persistence via window.openai
      if (openai?.setWidgetState) {
        openai.setWidgetState({
          projectId: project.id,
          slug: project.slug,
          renderedAt: Date.now()
        });
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', () => {
      if (projectData) renderTool(projectData);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (openai?.requestDisplayMode) {
        openai.requestDisplayMode({ mode: 'fullscreen' });
      } else {
        alert('Fullscreen requested in host environment.');
      }
    });

    document.getElementById('openStudioBtn').addEventListener('click', () => {
      if (projectData?.preview_url) {
        window.open(projectData.preview_url, '_blank');
      }
    });

    // JSON-RPC postMessage listener
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.method === 'ui/initialize') {
        window.parent.postMessage({
          jsonrpc: '2.0',
          method: 'ui/notifications/initialized',
          params: {}
        }, '*');
      } else if (msg.method === 'ui/notifications/tool-result') {
        const sc = msg.params?.structuredContent;
        if (sc?.project) {
          renderTool(sc.project);
        }
      }
    });

    // Signal host iframe is initialized
    window.parent.postMessage({
      jsonrpc: '2.0',
      method: 'ui/notifications/initialized',
      params: {}
    }, '*');
  </script>
</body>
</html>
